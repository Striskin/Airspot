<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AirSpot — Account</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header class="navbar-card" role="banner">
    <div class="brand">
      <div class="logo" id="logo-btn">☁</div>
      <h1>AirSpot</h1>
    </div>
    <div class="controls">
      <button class="btn" onclick="location.href='/'">Shop</button>
      <button class="btn" onclick="location.href='/cart.html'">Cart</button>
    </div>
  </header>

  <main class="container">
    <div class="card auth-box">
      <h2>Sign In / Sign Up</h2>

      <div>
        <label>Email</label>
        <input id="emailInput" class="input" placeholder="you@domain.com" />
      </div>

      <div>
        <label>Full name (for sign up)</label>
        <input id="nameInput" class="input" placeholder="Your full name" />
      </div>

      <div style="display:flex;gap:10px;margin-top:10px">
        <button class="btn" id="signupBtn">Sign Up</button>
        <button class="btn" id="signinBtn">Sign In</button>
        <button class="btn" id="signoutBtn">Sign Out</button>
      </div>

      <div id="userMsg" class="small-note"></div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.AirSpot && AirSpot.initUserPage) AirSpot.initUserPage();
      document.getElementById('signupBtn').addEventListener('click', () => {
        AirSpot.userRegisterFromPage();
      });
      document.getElementById('signinBtn').addEventListener('click', () => {
        AirSpot.userSignInFromPage();
      });
      document.getElementById('signoutBtn').addEventListener('click', () => {
        AirSpot.userSignOut();
      });
      document.getElementById('logo-btn').addEventListener('click', () => {
    window.location.href = '/';
  });
    });
  </script>
</body>
</html>
