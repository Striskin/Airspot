<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AirSpot — Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <!-- Navbar (card-style) -->
  <header class="navbar-card" role="banner">
    <div class="brand">
      <div class="logo" id="logo-btn">☁</div>
      <h1>AirSpot</h1>
    </div>

    <div class="controls" style="gap:8px;display:flex;align-items:center">
      <!-- Saludo compacto (solo visible si hay usuario) -->
      <div id="greetPill" class="btn" style="display:none;cursor:default;opacity:.95">
        Hi, <span id="greetName">User</span> 👋
      </div>

      <button class="btn" id="btn-worker">Worker</button>
      <button class="btn" id="btn-user">Sign In / Sign Up</button>
      <button class="btn" id="btn-cart">Cart <span class="badge" id="nav-badge">0</span></button>
    </div>
  </header>

  <main class="container">
    <h1 class="card">AirSpot — Shop</h1>

    <!-- (Banner eliminado) -->

    <div id="products" class="product-grid"></div>
  </main>

  <script src="app.js"></script>
  <script>
    // navegación
    document.getElementById('btn-cart').addEventListener('click', () => location.href = '/cart.html');
    document.getElementById('btn-worker').addEventListener('click', () => location.href = '/worker.html');
    document.getElementById('btn-user').addEventListener('click', () => location.href = '/user.html');
    document.getElementById('logo-btn').addEventListener('click', () => location.href = '/');

    // pintar saludo al cargar
    document.addEventListener('DOMContentLoaded', () => {
      if (window.AirSpot) {
        AirSpot.renderUserGreeting();
      }
    });

    // si cambia el storage (login/logout en otra pestaña) refrescamos
    window.addEventListener('storage', (e) => {
      if (e.key === 'airspot_customer' && window.AirSpot) {
        AirSpot.renderUserGreeting();
        AirSpot.initShop && AirSpot.initShop();
      }
    });
  </script>
</body>
</html>
