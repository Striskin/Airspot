<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AirSpot — Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <!-- Navbar (card-style) -->
  <header class="navbar-card" role="banner">
    <div class="brand">
      <div class="logo" id="logo-btn">☁</div>
      <h1>AirSpot</h1>
    </div>
    <div class="controls">
      <button class="btn" id="btn-worker">Worker</button>
      <button class="btn" id="btn-user">Sign In / Sign Up</button>
      <button class="btn" id="btn-cart">Cart <span class="badge" id="nav-badge">0</span></button>
    </div>
  </header>

  <main class="container">
    <h1 class="card">AirSpot — Shop</h1>

    <div id="products" class="product-grid"></div>
  </main>

  <script src="app.js"></script>
  <script>
    // attach navbar button behavior (they navigate)
    document.getElementById('btn-cart').addEventListener('click', () => location.href = '/cart.html');
    document.getElementById('btn-worker').addEventListener('click', () => location.href = '/worker.html');
    document.getElementById('btn-user').addEventListener('click', () => location.href = '/user.html');
    document.getElementById('logo-btn').addEventListener('click', () => location.href = '/');
  </script>
</body>
</html>
