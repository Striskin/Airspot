<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AirSpot — Worker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header class="navbar-card" role="banner">
    <div class="brand">
      <div class="logo" id="logo-btn">☁</div>
      <h1>AirSpot</h1>
    </div>
    <div class="controls">
      <button class="btn" onclick="location.href='/'">Shop</button>
      <button class="btn" onclick="location.href='/cart.html'">Cart</button>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <h2>Worker Login</h2>

      <div style="max-width:520px">
        <input id="w-name" class="input" placeholder="Name (for register)" />
        <input id="w-email" class="input" placeholder="Email" />
        <input id="w-password" class="input" placeholder="Password" type="password" />
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn" id="w-register">Register</button>
          <button class="btn" id="w-login">Login</button>
        </div>
        <div id="workerMsg" class="small-note"></div>
      </div>
    </div>

    <div class="card" id="workerPanel" style="display:none;margin-top:18px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <h3 id="who">Worker</h3>
          <div id="role" class="small"></div>
        </div>
        <div>
          <button class="btn" id="clockInBtn">Clock In</button>
          <button class="btn" id="clockOutBtn">Clock Out</button>
        </div>
      </div>

      <div style="margin-top:12px">
        <h4>Your hours</h4>
        <div id="hours">—</div>
        <h4 style="margin-top:12px">Shifts</h4>
        <div id="shifts"></div>
      </div>
    </div>

    <div class="card" style="margin-top:18px">
      <h3>Inventory (read-only)</h3>
      <div id="inventory"></div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // wire register / login
      document.getElementById('w-register').addEventListener('click', () => {
        AirSpot.workerRegisterFromPage();
      });
      document.getElementById('w-login').addEventListener('click', () => {
        AirSpot.workerLoginFromPage();
      });
      document.getElementById('clockInBtn').addEventListener('click', () => AirSpot.workerClock('in'));
      document.getElementById('clockOutBtn').addEventListener('click', () => AirSpot.workerClock('out'));
    });
    document.getElementById('logo-btn').addEventListener('click', () => {
    window.location.href = '/';
  });
  </script>
</body>
</html>
